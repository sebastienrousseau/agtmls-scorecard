name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v

  self-score:
    name: scores itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A scorecard that cannot pass its own rubric is a scorecard nobody
      # should take advice from. The floor is deliberately below 10: the three
      # failures it still reports on itself are real, and hiding them by
      # lowering the bar to zero would be the exact dishonesty this tool exists
      # to remove.
      - name: Score this repository
        run: |
          PYTHONPATH=src python3 -m agtmls_scorecard . --fail-under 8.0 --min-coverage 0.35

  signatures:
    name: commits are signed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          git config gpg.ssh.allowedSignersFile KEYS.asc
          unsigned=0
          # --no-merges: on a pull_request event HEAD is the synthetic merge
          # commit GitHub creates, which no contributor signs.
          for commit in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            author=$(git log -1 --format='%an' "$commit")
            # A bot's commits are signed by GitHub's key, not by a maintainer
            # key in KEYS.asc, so they verify as E here. That is a different
            # trust path -- authenticated by the forge, not by us -- and this
            # gate governs contributor commits. Excluding them is deliberate;
            # a human commit pushed to a bot's branch is still checked.
            case "$author" in
              *"[bot]") echo "skipping bot commit $commit ($author)"; continue ;;
            esac
            status=$(git log -1 --format='%G?' "$commit")
            if [ "$status" != "G" ] && [ "$status" != "U" ]; then
              echo "::error::unsigned or unverifiable commit $commit (%G? = $status)"
              unsigned=1
            fi
          done
          test "$unsigned" -eq 0
